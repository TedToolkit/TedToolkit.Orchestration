on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build TedToolkit.Orchestration.slnx --configuration Release
      - name: Build automation project
        run: dotnet build build/TedToolkit.Orchestration.Build/TedToolkit.Orchestration.Build.csproj --configuration Release
      - name: Test Pipeline
        run: dotnet run --project tests/TedToolkit.Orchestration.Pipeline.Tests --configuration Release --no-build
      - name: Pack library
        run: dotnet pack src/TedToolkit.Orchestration.Pipeline/TedToolkit.Orchestration.Pipeline.csproj --configuration Release --no-build --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
