on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-build-project:
    if: github.ref != 'refs/heads/main'
    uses: TedToolkit/TedToolkit/.github/workflows/build.yml@bfd033dcb10bcb4f0aa338b00d89bb913005ee96

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: TedToolkit/TedToolkit/.github/actions/publish-nuget@bfd033dcb10bcb4f0aa338b00d89bb913005ee96
        with:
          nuget-user: ArchiTed
