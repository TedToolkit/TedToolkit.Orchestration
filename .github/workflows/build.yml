on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-build-project:
    if: github.ref != 'refs/heads/main'
    uses: TedToolkit/TedToolkit/.github/workflows/legacy-build.yml@b45c29c681eecdec42d23c3324e474a78f1902d9

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: TedToolkit/TedToolkit/.github/actions/publish-nuget-legacy@b45c29c681eecdec42d23c3324e474a78f1902d9
        with:
          nuget-user: ArchiTed
